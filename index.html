<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spanish Glow - HBC Medical Group</title>
    <link rel="icon" type="image/png" href="Asset 2.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to bottom, #e8f4f8 0%, #ffffff 50%, #e8f4f8 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 0;
        }

        .container {
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
            position: relative;
            background: white;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.1);
        }

        /* Wave borders on sides */
        .container::before,
        .container::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            width: 40px;
            background-image: url('wavey.png');
            background-repeat: repeat-y;
            background-size: contain;
            opacity: 0.3;
            pointer-events: none;
        }

        .container::before {
            left: -40px;
            transform: scaleX(-1);
        }

        .container::after {
            right: -40px;
        }

        .hero-section {
            position: relative;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hero-image {
            width: 100%;
            display: block;
        }

        .button-section {
            position: relative;
            width: 100%;
        }

        .button-section img {
            width: 100%;
            display: block;
        }

        .section-image {
            width: 100%;
            display: block;
        }

        /* Etapes section with text overlay */
        .etapes-section {
            position: relative;
            width: 100%;
        }

        .etapes-section img {
            width: 100%;
            display: block;
        }

        .etapes-text-overlay {
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: white;
            width: 90%;
            max-width: 420px;
        }

        .etapes-text-overlay h3 {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .etapes-text-overlay p {
            font-size: 18px;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .etapes-text-overlay .contact-note {
            font-size: 16px;
            font-weight: 600;
            margin-top: 12px;
        }

        @media (max-width: 768px) {
            .etapes-text-overlay {
                bottom: 12%;
            }

            .etapes-text-overlay h3 {
                font-size: 18px;
            }

            .etapes-text-overlay p {
                font-size: 15px;
            }

            .etapes-text-overlay .contact-note {
                font-size: 14px;
            }
        }

        @media (max-width: 480px) {
            .etapes-text-overlay {
                bottom: 10%;
            }

            .etapes-text-overlay h3 {
                font-size: 15px;
            }

            .etapes-text-overlay p {
                font-size: 13px;
            }

            .etapes-text-overlay .contact-note {
                font-size: 12px;
            }
        }

        .form-section {
            width: 100%;
            background-color: white;
            padding: 20px 20px 10px 20px;
            text-align: center;
        }

        .form-section img {
            width: 100%;
            display: block;
            margin: 0 auto 0px;
        }

        .contact-form {
            max-width: 500px;
            margin: 0 auto;
            padding: 30px;
            background: linear-gradient(to bottom, #f8fdfe 0%, #ffffff 100%);
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(59, 169, 187, 0.15);
        }

        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #2d3748;
            letter-spacing: 0.3px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 15px 18px;
            font-size: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-family: Arial, sans-serif;
            transition: all 0.3s ease;
            background-color: #fff;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #3ba9bb;
            box-shadow: 0 0 0 3px rgba(59, 169, 187, 0.1);
            transform: translateY(-1px);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .submit-button {
            background: linear-gradient(135deg, #3ba9bb 0%, #2d8a99 100%);
            color: white;
            font-size: 19px;
            font-weight: bold;
            padding: 18px 50px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(59, 169, 187, 0.3);
            width: 100%;
            letter-spacing: 0.5px;
        }

        .submit-button:hover {
            background: linear-gradient(135deg, #2d8a99 0%, #1f6b77 100%);
            box-shadow: 0 8px 25px rgba(59, 169, 187, 0.4);
            transform: translateY(-2px);
        }

        .submit-button:active {
            transform: translateY(0px);
        }

        .submit-button:disabled {
            background: linear-gradient(135deg, #cbd5e0 0%, #a0aec0 100%);
            cursor: not-allowed;
            box-shadow: none;
        }

        .form-message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }

        .form-message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .form-message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        @media (max-width: 768px) {
            .container {
                max-width: 100%;
            }


            .container::before,
            .container::after {
                width: 20px;
            }

            .container::before {
                left: -20px;
            }

            .container::after {
                right: -20px;
            }
        }

        @media (max-width: 480px) {
            .container::before,
            .container::after {
                display: none;
            }
        }

        /* Floating scroll button */
        .floating-button {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, #3ba9bb 0%, #2d8a99 100%);
            color: white;
            padding: 18px 30px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 20px rgba(59, 169, 187, 0.6);
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 1000;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            white-space: nowrap;
            animation: pulse 2s infinite;
            border: 3px solid white;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 6px 20px rgba(59, 169, 187, 0.6);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 8px 25px rgba(59, 169, 187, 0.8);
            }
        }

        .floating-button:hover {
            background: linear-gradient(135deg, #2d8a99 0%, #1f6b77 100%);
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 25px rgba(59, 169, 187, 0.9);
            animation: none;
        }

        @media (min-width: 769px) {
            .floating-button {
                right: calc(50% - 240px + 30px);
            }
        }

        @media (max-width: 768px) {
            .floating-button {
                padding: 15px 25px;
                bottom: 20px;
                right: 20px;
                font-size: 16px;
            }
        }

        @media (max-width: 480px) {
            .floating-button {
                padding: 12px 20px;
                font-size: 14px;
                right: 15px;
                bottom: 15px;
            }
        }

        /* Map section */
        .map-section {
            width: 100%;
            background-color: white;
            padding: 20px 20px 40px 20px;
            text-align: center;
        }

        .map-container {
            width: 100%;
            max-width: 100%;
            height: 550px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin: 0 auto;
        }

        .map-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        @media (max-width: 768px) {
            .map-container {
                height: 450px;
            }
        }

        /* CTA button between map and engagement */
        .cta-button-section {
            text-align: center;
            padding: 40px 20px;
            background-color: white;
        }

        .cta-button {
            background: linear-gradient(135deg, #3ba9bb 0%, #2d8a99 100%);
            color: white;
            font-size: 20px;
            font-weight: bold;
            padding: 20px 60px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(59, 169, 187, 0.4);
            text-decoration: none;
            display: inline-block;
            letter-spacing: 0.5px;
        }

        .cta-button:hover {
            background: linear-gradient(135deg, #2d8a99 0%, #1f6b77 100%);
            box-shadow: 0 8px 25px rgba(59, 169, 187, 0.6);
            transform: translateY(-3px);
        }

        @media (max-width: 768px) {
            .cta-button {
                font-size: 18px;
                padding: 18px 50px;
            }
        }

        /* Engagement image spacing adjustment */
        .engagement-image {
            margin-top: -40px;
            margin-bottom: -40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Hero Section -->
        <div class="hero-section">
            <img src="Hero.png" alt="Spanish Glow Hero" class="hero-image">
        </div>

        <!-- Button Section -->
        <div class="button-section">
            <a href="#form">
                <img src="hero button.png" alt="HBC Medical Group">
            </a>
        </div>

        <!-- Etapes Section -->
        <img src="etapes.png" alt="Les étapes du Spanish Glow" class="section-image">

        <!-- Wavey decoration -->
        <a href="#form">
            <img src="new form.png" alt="Decoration" class="section-image">
        </a>

        <!-- Form Section -->
        <div id="form" class="form-section">
            <form class="contact-form" id="contactForm">
                <div class="form-group">
                    <label for="nom">Nom Complet</label>
                    <input type="text" id="nom" name="nom" required>
                </div>

                <div class="form-group">
                    <label for="telephone">Téléphone</label>
                    <input type="tel" id="telephone" name="telephone" required>
                </div>

                <div class="form-group">
                    <label for="remarques">Remarques</label>
                    <textarea id="remarques" name="remarques"></textarea>
                </div>

                <button type="submit" class="submit-button">Envoyer</button>
                <div class="form-message" id="formMessage"></div>
            </form>

            <script>
                const scriptURL = 'https://script.google.com/macros/s/AKfycbwnHdgzBrvW0wrbJQppUA1yTgw8WXsR8StC1C1tOdV8C-d8TcC2MUtpsiLSgpDQaOYLtQ/exec';
                const form = document.getElementById('contactForm');
                const submitButton = form.querySelector('.submit-button');
                const formMessage = document.getElementById('formMessage');

                form.addEventListener('submit', e => {
                    e.preventDefault();

                    submitButton.disabled = true;
                    submitButton.textContent = 'Envoi en cours...';
                    formMessage.style.display = 'none';

                    fetch(scriptURL, {
                        method: 'POST',
                        body: new FormData(form)
                    })
                    .then(response => {
                        formMessage.textContent = 'Merci! Votre message a été envoyé avec succès.';
                        formMessage.className = 'form-message success';
                        formMessage.style.display = 'block';
                        form.reset();
                    })
                    .catch(error => {
                        formMessage.textContent = 'Erreur lors de l\'envoi. Veuillez réessayer.';
                        formMessage.className = 'form-message error';
                        formMessage.style.display = 'block';
                    })
                    .finally(() => {
                        submitButton.disabled = false;
                        submitButton.textContent = 'Envoyer';
                    });
                });
            </script>

            <img src="localisation new 3.png" alt="Localisation">
        </div>

        <!-- Map Section -->
        <div class="map-section">
            <div class="map-container">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3323.7447964676844!2d-7.633333!3d33.589722!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x29f569e965cb6df!2sHBC%20Medical%20Group!5e0!3m2!1sfr-MA!2sma!4v1234567890" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
        </div>

        <!-- Engagement Section -->
        <img src="engagement update.png" alt="Notre engagement" class="section-image">

        <!-- FAQ Section -->
        <img src="faq update.png" alt="Questions fréquentes" class="section-image">

        <!-- Footer Logo -->
        <div style="text-align: center; padding: 20px 20px 40px 20px; background-color: white;">
            <img src="Asset 3@4x.png" alt="HBC Medical Group" style="max-width: 300px; width: 100%; display: block; margin: 0 auto;">
        </div>
    </div>

    <!-- Floating button that scrolls to form -->
    <a href="#form" class="floating-button" title="Contactez-nous">Réservez maintenant</a>
</body>
</html>
